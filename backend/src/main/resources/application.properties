spring.application.name=backend
server.port=8080
# Rules, team verdicts and reports (relative to the working directory)
cardpool.data-dir=data

# Cards: the CardsData CSV files, loaded in memory at startup. Relative to the working directory
# (backend/ with mvn spring-boot:run); filled and updated by ./update-cardsdata.sh at the project root.
cardpool.cardsdata-dir=cardsdata

# Default share of each set in a generated pool, proposed by the generator form
cardpool.default-set-weights.COREKS=0.05
cardpool.default-set-weights.CORE=0.05
cardpool.default-set-weights.ALIZE=0.10
cardpool.default-set-weights.BISE=0.10
cardpool.default-set-weights.CYCLONE=0.20
cardpool.default-set-weights.DUSTER=0.25
cardpool.default-set-weights.EOLE=0.25

# Run a few draws in the background at startup so the first pools are as fast as the next ones
cardpool.warm-up=true
